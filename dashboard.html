<!DOCTYPE html>
<html>
<head>
    <title>Seating Dashboard</title>
    <link rel="stylesheet" href="/static/stylex.css">
    <style>
        body{
            margin:0;
            font-family:Segoe UI, Arial;
            background:#f4f7fb;
        }
        .login-page{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }
        .login-box{
            width:420px;
            background:white;
            padding:30px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        /* Naya Style H2 ke liye */
        .user-info-h2 {
            font-size: 15px;
            color: #555;
            background: #f9fbff;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #b9cceb;
            margin-top: 0;
            margin-bottom: 20px;
        }
        h2.main-title {
            color: #112D4E;
            margin-bottom: 5px;
        }
        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input, button{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:8px;
            border:1px solid #ccc;
            box-sizing: border-box; 
        }
        button{
            background:#3F72AF;
            color:white;
            border:none;
            cursor:pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }
        button:hover{
            background:#112D4E;
        }
        #liveBox{
            margin-top:10px;
            padding:12px;
            background:#eaf2ff;
            color: #112D4E;
            border-left: 5px solid #3F72AF;
            border-radius:8px;
            display:none;
            font-weight:bold;
            text-align: left;
        }
        .cancel-btn{
            display:inline-block;
            margin-top:15px;
            color:#e74c3c;
            text-decoration:none;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="login-page">
    <div class="login-box">

        <!-- NAYA H2 TAG: User ID aur Date yaha show hogi -->
        <h2 class="user-info-h2">
            👤 User: <span style="color:#3F72AF;">{{ session['user'] }}</span> | 📅 Date: <span id="sysDate" style="color:#3F72AF;"></span>
        </h2>

        <h2 class="main-title">Seating Dashboard</h2>
        <p>Upload the student Excel list to begin setup.</p>

        <form action="/setup-seating" method="POST" enctype="multipart/form-data">
            <input type="file" name="excelFile" accept=".xlsx,.xls" onchange="countStudents()" required>
            <div id="liveBox"></div>
            <button type="submit">Start Room Assignment →</button>
        </form>
        
        <a href="/logout" class="cancel-btn">← Logout</a>

    </div>
</div>

<script>
// Aaj ki date set karne ke liye JS
document.getElementById('sysDate').innerText = new Date().toLocaleDateString('en-IN');

// Excel students count logic
async function countStudents(){
    let file = document.querySelector('[name="excelFile"]').files[0];
    if(!file) return;

    let formData = new FormData();
    formData.append("excelFile", file);

    try {
        let response = await fetch("/count-excel", {
            method:"POST",
            body:formData
        });

        let data = await response.json();
        let total = data.count;

        let box = document.getElementById("liveBox");
        box.style.display = "block";
        box.innerHTML = `Total Students Detected: ${total}`;
    } catch (e) {
        console.error("Error reading file:", e);
    }
}
</script>

</body>
</html>
