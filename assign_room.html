<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assign Next Room</title>
<style>
    body { background: #eef2f7; font-family: Segoe UI, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    .alert { background: #eaf2ff; color: #112D4E; padding: 15px; border-radius: 10px; font-weight: bold; margin-bottom: 20px; font-size: 18px; border-left: 5px solid #3F72AF; text-align: left;}
    input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    button { background: #3F72AF; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;}
    button:hover { background: #112D4E; }
</style>
</head>
<body>

<div class="card">
    <div class="alert">
        ⚠️ {{ remaining_count }} Students are free.<br>
        <span style="font-size:14px; font-weight:normal;">Please configure the next room for them.</span>
    </div>

    <form action="/assign-room" method="POST">
        <input type="text" name="room_number" placeholder="Enter Room Number / Name" required>
        <input type="number" name="rows" placeholder="Number of attributes" min="1" required>
        <input type="number" name="columns" placeholder="Number of Rows" min="1" required>
        <input type="number" name="students_per_bench" placeholder="Students per Bench" min="1" value="2" required>
        
        <button type="submit">Generate Room & Continue</button>
    </form>
    
    <br>
    <a href="/seating-result" style="color:#e74c3c; text-decoration:none; font-size:14px;">Force Finish (Ignore Remaining)</a>
</div>

</body>
</html>
