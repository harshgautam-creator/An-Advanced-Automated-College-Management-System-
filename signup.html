<!DOCTYPE html>
<html>
<head>
    <title>Staff Signup</title>
    <link rel="stylesheet" href="/static/stylex.css">
</head>
<body>

<div class="login-page">
<div class="login-box">
<h2>Create Staff Account</h2>

<form method="POST">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="text" name="staff_id" placeholder="Staff ID" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="portal-btn full-btn">Create Account</button>
</form>

<br>
<a href="/seating-login" class="cancel-btn">← Back to Login</a>

</div>
</div>

</body>
</html>
