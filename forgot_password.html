<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Forgot Password</title>

<style>

body{
    margin:0;
    padding:0;
    background:#eef2f7;
    font-family:Segoe UI, Arial, sans-serif;
}

.forgot-box{
    width:420px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    margin:70px auto;
}

h2{
    text-align:center;
    color:#112D4E;
    margin-bottom:28px;
    font-size:32px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    box-sizing:border-box;
}

input:focus{
    outline:none;
    border:1px solid #3F72AF;
    box-shadow:0 0 6px rgba(63,114,175,0.2);
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#3F72AF;
    color:white;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#2f5f97;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
    color:green;
}

.bottom-links{
    text-align:center;
    margin-top:18px;
}

.bottom-links a{
    text-decoration:none;
    color:#3F72AF;
    font-weight:500;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    color:#ff4d4d;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:500px){

    .forgot-box{
        width:90%;
        padding:25px;
        margin:40px auto;
    }

}

</style>
</head>

<body>

<div class="forgot-box">

<h2>Forgot Password</h2>

<form method="POST">

<input type="text"
       name="enrollment"
       placeholder="Enter Enrollment Number"
       required>

<input type="password"
       name="new_password"
       placeholder="Enter New Password"
       required>

<button type="submit">

Update Password

</button>

</form>

<div class="message">

{{ message }}

</div>

<div class="bottom-links">

<a href="/student-login">

Back To Login

</a>

</div>

<div class="back">

<a href="/">← Back to Home</a>

</div>

</div>

</body>
</html>
