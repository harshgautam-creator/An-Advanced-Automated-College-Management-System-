<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Login</title>
<link rel="stylesheet" href="/static/stylex.css">

<style>
body{
    margin:0;
    padding:0;
    background:#eef2f7;
    font-family:Segoe UI;
}

.login-box{
    width:400px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    margin:100px auto;
}

h2{
    text-align:center;
    color:#112D4E;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#3F72AF;
    color:white;
    border-radius:10px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
}

.links a{
    text-decoration:none;
    color:#3F72AF;
}

.back{
    text-align:center;
    margin-top:25px;
}

.back a{
    color:#ff4d4d;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

<h2>Student Login</h2>

<form method="POST">

<input type="text" name="enrollment" placeholder="Enter Enrollment Number" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

<div class="links">
<a href="/student-signup">Sign Up</a>
<a href="/student-forgot-password">Forgot Password?</a>
</div>

<div class="back">
<a href="/">← Back to Home</a>
</div>

</div>

</body>
</html>
