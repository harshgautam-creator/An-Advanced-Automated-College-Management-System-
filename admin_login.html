<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<style>
body{
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.box{
background:white;
padding:30px;
width:320px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}
input{
width:100%;
padding:10px;
margin:10px 0;
}
button{
width:100%;
padding:10px;
background:#007bff;
color:white;
border:none;
cursor:pointer;
}
.error{
color:red;
}
</style>
</head>
<body>

<div class="box">
<h2>Admin Login</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

</div>

</body>
</html>
